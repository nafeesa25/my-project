<!DOCTYPE html>
<html>
<head>
    <title>My Mobile App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 390px;
            min-height: 100vh;
            background: white;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>My Mobile App</h1>

        <p>Welcome to my first app</p>

        <a href="app.html" class="button">
            Open App
        </a>

    </div>

</body>
</html>
